<!DOCTYPE html>
<html>
    <head>
        <title>Trenchie Ticker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="panels">
            <section id="modpanel" class="box">
                <div id="guy"></div>
                <div id="tiers">
                    <div class="lonetier">
                        <button class="button">
                        Clean Shave (25 Tin)
                        <div class="flavor">You can't tangle no hair!</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button">
                        Helmet Spike (125 Tin)
                        <div class="flavor">No reason, why?</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button">Camoflage (1000 Tin)
                        <div class="flavor">There's only so much paint to go around. Ink?</div>
                        </button>
                        <button class="button">
                        Patriotic Colors (1 Tin)
                        <div class="flavor">At least it's cheap.</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button">Eye Drying Treatment (2500 Tin)</button>
                    </div>
                    <div class="andtier">
                        <button class="button">Cat Food (2500 Tin)</button>
                        <button class="button">Rats (-2 Tin)</button>
                    </div>
                    <div class="lonetier">
                        <button class="button">Trench Cats (10000 Tin)</button>
                    </div>
                    <div class="ortier">
                        <button class="button">Gun Safety Training (10000 Tin)</button>
                        <button class="button">Gun Efficiency Training (20000 Tin)</button>
                    </div>
                    <div class="lonetier">
                        <button class="button">Acid Resistance Training (25000 Tin)</button>
                    </div>
                    <div class="lonetier">
                        <button class="button">Salt (50000 Tin)</button>
                    </div>
                    <div class="ortier">
                        <button class="button">Lobotomy (100000 Tin)</button>
                        <button class="button">Fireworks (100000 Tin)</button>
                    </div>
                </div>
            </section>
            <section id="clickpanel" class="box">
                <div id="tinbutton">
                    <p> </p>
                </div>
            </section>
            <section id="elsepanel" class="box">
                <div id="tintext">Tin:<span id="tinnumber">0</span></div>
            </section>
        </div>
        <script src="script.js"></script>
    </body>
</html>
