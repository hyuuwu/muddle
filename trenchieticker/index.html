<!DOCTYPE html>
<html>
  <head>
    <title>Trenchie Ticker</title>
    <style>
      .box {
        position:fixed;
        min-height:20px;
        min-width:20px;
        border:2px solid black;
        background-color:#777;
        margin:0;
      }
      #clickbox {
        top:0;
        right:255px;
        left:0;
        width:auto;
        height:255px;
      }
      #elsebox {
        top:255px;
        right:255px;
        bottom:0;
        left:0;
        width:auto;
        height:auto;
      }
      #modbox {
        top:0;
        bottom:0;
        right:0;
        width:255px;
        height:auto;
      }
    </style>
  </head>
  <body>
    <div id="clickbox" class="box"></div>
    <div id="modbox" class="box"></div>
    <div id="elsebox" class="box"></div>
  </body>
</html>
