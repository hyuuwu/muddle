<!DOCTYPE html>
<html>
    <head>
        <title>Trenchie Ticker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="panels">
            <section id="modpanel" class="box">
                <div id="guy"></div>
                <div id="tiers">
                    <div class="lonetier">
                        <button class="button" id="mod1" data-cost="25">
                            Clean Shave (25 Tin)
                            <div class="flavor">You can't tangle no hair!</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" id="mod2" data-cost="125">
                            Helmet Spike (125 Tin)
                            <div class="flavor">No reason, why?</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" id="mod3A" data-cost="1000">
                            Camoflage (1000 Tin)
                            <div class="flavor">There's only so much paint to go around. Ink?</div>
                        </button>
                        <button class="button" id="mod3B" data-cost="1">
                            Patriotic Colors (1 Tin)
                            <div class="flavor">At least it's cheap.</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" id="mod4" data-cost="2500">
                            Eye Drying Treatment (2500 Tin)
                            <div class="flavor">The perfect counter to flares.</div>
                        </button>
                    </div>
                    <div class="andtier">
                        <button class="button" id="mod5A" data-cost="2500">
                            Cat Food (2500 Tin)
                            <div class="flavor">There's no cats, why are we... ah.</div>
                        </button>
                        <button class="button" id="mod5B" data-cost="-2">
                            Rats (-2 Tin)
                            <div class="flavor">What? Here? I'd better be compensated for this!</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" id="mod6" data-cost="10000">
                            Trench Cats (10000 Tin)
                            <div class="flavor">Ohh that's why the cat food.</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" id="mod7A" data-cost="20000">
                            Gun Safety Training (20000 Tin)
                            <div class="flavor">The most important thing is never to hit an ally.</div>
                        </button>
                        <button class="button" id="mod7B" data-cost="10000">
                            Gun Efficiency Training (10000 Tin)
                            <div class="flavor">The most important thing is never to miss a shot.</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" id="mod8" data-cost="25000">
                            Acid Resistance Training (25000 Tin)
                            <div class="flavor">Gas, poison, these guys are resilient!</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" id="mod9" data-cost="50000">
                            Salt (50000 Tin)
                            <div class="flavor">For the snow to come.</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" id="mod10A" data-cost="100000">
                            Lobotomies (100000 Tin)
                            <div class="flavor">To make them happy.</div>
                        </button>
                        <button class="button" id="mod10B" data-cost="100000">
                            Fireworks (100000 Tin)
                            <div class="flavor">To make them happy.</div>
                        </button>
                    </div>
                </div>
            </section>
            <section id="clickpanel" class="box">
                <div id="tinbutton">
                    <p> </p>
                </div>
            </section>
            <section id="elsepanel" class="box">
                <div id="tintext">Tin:<span id="tinnumber">0</span></div>
            </section>
        </div>
        <script src="script.js"></script>
    </body>
</html>
