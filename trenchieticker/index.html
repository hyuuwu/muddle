<!DOCTYPE html>
<html>
  <head>
    <title>Trenchie Ticker</title>
    <style>
      .box {
        position:fixed;
        min-height:20px;
        min-width:20px;
        border:2px solid black;
        background-color:#777;
        padding:0;
      }
      #clickbox {
        top:0;
        right:255px;
        left:0;
        width:calc(100%-255px);
        height:255px;
      }
        #click {
          position:relative;
          margin-top:auto;
          width:100%;
          height:51px;
          background:url('sprites/thetrench.png');
          background-repeat:repeat-x;
        }
      #elsebox {
        top:255px;
        right:255px;
        bottom:0;
        left:0;
        width:calc(100%-255px);
        height:calc(100%-255px);
      }
      #modbox {
        top:0;
        bottom:0;
        right:0;
        width:255px;
        height:100%;
      }
    </style>
  </head>
  <body>
    <div id="clickbox" class="box"></div>
      <button id="click"></button>
    <div id="modbox" class="box"></div>
    <div id="elsebox" class="box"></div>
  </body>
</html>
