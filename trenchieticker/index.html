<!DOCTYPE html>
<html>
  <head>
    <title>Trenchie Ticker</title>
    <style>
      .box {
        position:fixed;
        min-height:20px;
        min-width:20px;
        border:2px solid black;
        background-color:#74a44b;
        padding:0;
        display:flex;
        flex-direction:column;
      }
      #clickbox {
        top:0;
        right:255px;
        left:0;
        width:calc(100%-255px);
        height:255px;
        background-color:#a3876f !important;
      }
        #click {
          margin-top:auto;
          width:100%;
          height:51px;
          justify-content:flex-end;
          order:66;
          background:url('/sprites/ourtrench.png');
          background-repeat:repeat-x;
        }
        #theirtrench {
          margin-bottom:auto;
          width:100%;
          height:51px;
          justify-content:flex-start;
          order:1;
          background:url('/sprites/theirtrench.png');
          background-repeat:repeat-x;
        }
      #elsebox {
        top:255px;
        right:255px;
        bottom:0;
        left:0;
        width:calc(100%-255px);
        height:calc(100%-255px);
      }
        .textbox {
          border:1px solid black;
          margin:2px;
        }
        #swapbox {
          width:100%;
          height:51px;
          min-width:51px;
          border:1px solid black;
          order:67;
          display:flex;
          flex-direction:row;
        }
          .swapbutton {
            width:50%;
            height:51px;
            min-height:51px;
            border:1px solid black;
          }
        #retire {
          margin-top:auto;
          width:102px;
          height:51px;
          background:url('/sprites/warbond.png');
          background-repeat:no-repeat;
          justify-content:flex-end;
          order:66;
        }
      #modbox {
        top:0;
        bottom:0;
        right:0;
        width:255px;
        height:100%;
        overflow-y:auto;
        justify-content:flex-start;
        background-color:transparent;
      }
      .modbutton {
        width:calc(100%-51px);
        height:51px;
        min-height:51px;
        margin:10px;
        border:1px solid black;
        overflow:visible;
        flex:1;
      }
      .andbuttons {
        display:flex;
        width:100%;
        flex-direction:row;
      }
      .orbuttons {
        display:flex;
        width:100%;
        flex-direction:row;
      }
      .fakemodbutton {
        background-color:transparent !important;
        border:0 !important;
        min-height:51px;
      }
    </style>
  </head>
  <body>
    <div id="clickbox" class="box">
      <div id="theirtrench"></div>
      <button id="click"></button>
    </div>
    <div id="modbox" class="box">
      <button class="modbutton">Clean Shave</button>
      <button class="modbutton">Spiked Helmets</button>
      <div class="orbuttons">
        <button class="modbutton">Patriotic Dye</button>
        <button class="modbutton">Camoflage</button>
      </div>
      <button class="modbutton">Eye Drying Treatment</button>
      <div class="andbuttons">
        <button class="modbutton">Cat Food Cans</button>
        <button class="modbutton">Rats</button>
      </div>
      <button class="modbutton">Trench Cats</button>
      <div class="orbuttons">
        <button class="modbutton">Gun Safety Training</button>
        <button class="modbutton">Aim Training</button>
      </div>
      <button class="modbutton">Acid Resistance Training</button>
      <button class="modbutton">Salt</button>
      <div class="orbuttons">
        <button class="modbutton">Lobotomies</button>
        <button class="modbutton">Fireworks</button>
      </div>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="fakemodbutton"></button>
      <button class="modbutton">The Greatest War</button>
      <button class="modbutton">Abilify</button>
    </div>
    <div id="elsebox" class="box">
      <div id="swapbox">
        <button class="swapbutton">Menu</button>
        <button class="swapbutton">Basics</button>
      </div>
      <p class="textbox">Tin:0</p>
      <p class="textbox">Days:0</p>
      <button id="retire"></button>
    </div>
  </body>
</html>
