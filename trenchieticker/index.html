<!DOCTYPE html>
<html>
    <head>
        <title>Trenchie Ticker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="panels">
            <section id="modpanel" class="box">
                <div id="guy"></div>
                <div id="tiers">
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(25,1,this)">
                            Clean Shave (25 Tin)
                            <div class="flavor">You can't tangle no hair! (+1 Tin per click)</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(125,1,this)">
                            Helmet Spike (125 Tin)
                            <div class="flavor">No reason, why? (+1 Tin per click)</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" onclick="buyMod(1000,1,this)">
                            Camoflage (1000 Tin)
                            <div class="flavor">There's only so much paint to go around. Ink? (+1 Tin per click)</div>
                        </button>
                        <button class="button" onclick="buyMod(1,0,this)">
                            Patriotic Colors (1 Tin)
                            <div class="flavor">At least it's cheap.</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(2500,2,this)">
                            Eye Drying Treatment (2500 Tin)
                            <div class="flavor">The perfect counter to flares. (+2 Tin per click)</div>
                        </button>
                    </div>
                    <div class="andtier">
                        <button class="button" onclick="buyMod(2500,0,this)">
                            Cat Food (2500 Tin)
                            <div class="flavor">There's no cats, why are we... ah.</div>
                        </button>
                        <button class="button" onclick="buyMod(-2,0,this)">
                            Rats (-2 Tin)
                            <div class="flavor">What? Here? I'd better be compensated for this!</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(10000,1,this)">
                            Trench Cats (10000 Tin)
                            <div class="flavor">Ohh that's why the cat food. (+1 Tin per click)</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" onclick="buyMod(10000,1,this)">
                            Gun Safety Training (10000 Tin)
                            <div class="flavor">The most important thing is never to hit an ally. (+1 Tin per click)</div>
                        </button>
                        <button class="button" onclick="buyMod(20000,2,this)">
                            Gun Efficiency Training (20000 Tin)
                            <div class="flavor">The most important thing is never to miss a shot. (+2 Tin per click)</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(25000,1,this)">
                            Acid Resistance Training (25000 Tin)
                            <div class="flavor">Gas, poison, these guys are resilient! (+1 Tin per click)</div>
                        </button>
                    </div>
                    <div class="lonetier">
                        <button class="button" onclick="buyMod(50000,0,this)">
                            Salt (50000 Tin)
                            <div class="flavor">For the snow to come.</div>
                        </button>
                    </div>
                    <div class="ortier">
                        <button class="button" onclick="buyMod(100000,4,this)">
                            Lobotomies (100000 Tin)
                            <div class="flavor">To make them happy. (+4 Tin per click)</div>
                        </button>
                        <button class="button" onclick="buyMod(100000,4,this)">
                            Fireworks (100000 Tin)
                            <div class="flavor">To make them happy. (+4 Tin per click)</div>
                        </button>
                    </div>
                </div>
            </section>
            <section id="clickpanel" class="box">
                <div id="runnerman"></div>
                <div id="tinbutton">
                    <p> </p>
                </div>
            </section>
            <section id="elsepanel" class="box">
                <div id="tintext">Tin:<span id="tinnumber">0</span></div>
            </section>
        </div>
        <script src="script.js"></script>
    </body>
</html>
